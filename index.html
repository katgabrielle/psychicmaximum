  .pm-banner {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5; height: 40px;
    display: flex; align-items: center; overflow: hidden;
    background: #EAE4D6; color: #23201C; text-decoration: none;
    border-bottom: 1px solid #23201C;
    box-shadow: 0 2px 14px rgba(0,0,0,0.4);
    font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap;
  }
  .pm-track { display: inline-flex; flex: none; animation: pm-scroll 80s linear infinite; will-change: transform; }
  .pm-banner:hover .pm-track, .pm-banner:focus-visible .pm-track { animation-play-state: paused; }
  .pm-track span { white-space: nowrap; }
  .pm-track i { font-style: normal; }
  @keyframes pm-scroll { to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .pm-track { animation: none; } }
  .pm-links { display: flex; justify-content: space-between; gap: 12px; margin-top: 22px; padding-top: 16px; border-top: 1px solid #A49C8E; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
  .pm-links button, .pm-links a { font: inherit; letter-spacing: inherit; text-transform: inherit; color: #23201C; background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  dialog.pm-dlg { border: 0; box-shadow: 0 1px 2px rgba(0,0,0,0.35), 3px 6px 14px rgba(0,0,0,0.45), 8px 18px 40px rgba(0,0,0,0.3); padding: 0; background: #EAE4D6; color: #23201C; width: min(680px, calc(100vw - 32px)); max-height: calc(100vh - 48px); text-transform: uppercase; }
  dialog.pm-dlg::backdrop { background: rgba(30,28,25,0.35); }
  .sheet { padding: 28px 32px 36px; overflow-y: auto; max-height: calc(100vh - 50px); }
  .sheet-top { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #23201C; padding-bottom: 10px; }
  .sheet-top h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; }
  .close { font: inherit; font-size: 11px; letter-spacing: 0.12em; background: none; border: 0; color: #23201C; cursor: pointer; padding: 4px 0; }
  .head { border-bottom: 1px solid #A49C8E; padding: 22px 0 8px; font-size: 11px; letter-spacing: 0.12em; }
  .small { margin-top: 18px; font-size: 11px; letter-spacing: 0.06em; }
  .div-fig { margin: 18px 0 0; min-height: 120px; display: flex; flex-direction: column; align-items: center; }
  .div-fig img { display: block; max-width: 100%; max-height: 66vh; width: auto; height: auto; opacity: 0; transition: opacity .4s; }
  .div-fig img.on { opacity: 1; }
  .div-fig figcaption { margin-top: 0; }
  .links { display: flex; gap: 12px 28px; flex-wrap: wrap; padding-top: 28px; font-size: 11px; letter-spacing: 0.12em; }
  .links button, .links a { font: inherit; letter-spacing: inherit; color: #23201C; background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .links a.push { margin-left: auto; }
  @media (max-width: 700px) { .sheet { padding: 22px 18px 28px; } }
  .staticrypt-content { min-height: 100%; display: flex; flex-direction: column; }
  .pm-centre { flex: 1; display: flex; align-items: center; justify-content: center; padding: 76px 16px 40px; }
  .pm-card {
    width: 100%;
    max-width: 400px;
    background: #EAE4D6;
    padding: 34px 32px 30px;
    text-align: center;
    box-shadow: 0 1px 2px rgba(0,0,0,0.35), 3px 6px 14px rgba(0,0,0,0.45), 8px 18px 40px rgba(0,0,0,0.3);
  }
  .pm-message {
    margin: 0 auto 18px;
    font-family: "Roboto", Helvetica, Arial, sans-serif;
    font-size: 13px;
    line-height: 1.5;
    color: #555;
  }
  .pm-message a { color: #111; }
  .staticrypt-password-container { position: relative; margin-bottom: 14px; }
  #staticrypt-password {
    width: 100%;
    padding: 12px 44px 12px 14px;
    border: 1px solid #A49C8E;
    border-radius: 0;
    background: #F4EFE3;
    color: #23201C;
    font-family: "Roboto", Helvetica, Arial, sans-serif;
    font-size: 16px;
    outline: none;
  }
  #staticrypt-password::placeholder { color: #8C8780; }
  #staticrypt-password:focus { border-color: #23201C; }
  .staticrypt-toggle-password-visibility {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    width: 20px; height: 20px; opacity: 0.5; cursor: pointer;
  }
  .staticrypt-decrypt-button {
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 0;
    background: #23201C;
    color: #EAE4D6;
    font-family: "Roboto", Helvetica, Arial, sans-serif;
    font-size: 13px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    cursor: pointer;
    -webkit-appearance: none;
  }
  .staticrypt-decrypt-button:hover { background: #000; }
  label.staticrypt-remember {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-bottom: 14px; font-size: 12px; color: #4a453e; cursor: pointer;
  }
  .hidden { display: none !important; }
  .staticrypt-spinner-container { height: 100%; display: flex; align-items: center; justify-content: center; }
  .staticrypt-spinner {
    width: 2rem; height: 2rem; border: 0.2em solid #EAE4D6; border-right-color: transparent;
    border-radius: 50%; animation: spin 0.75s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 600px) {
    .pm-card { padding: 30px 22px 26px; }
    .pm-banner { font-size: 11px; height: 36px; }
    .pm-centre { padding-top: 68px; }
  }

  function divLoad(start, cb, fail) {
    var e = DIV_POSTS[start];
    if (!e) { fail(); return; }
    setTimeout(function(){
      cb({ 'posts-total': DIV_POSTS.length, posts: [{ url: 'https://instantdivination.tumblr.com/post/' + e[0], 'photo-url-1280': 'https://64.media.tumblr.com/' + e[1] }] });

  }
  function divShow(d) {
    var img = document.getElementById('div-img'), msg = document.getElementById('div-msg');
    if (d && d['posts-total']) DIV.total = +d['posts-total'];
    var p = d && d.posts && d.posts[0], src = '', set = '';
    DIV.post = p ? (p['url-with-slug'] || p.url) : '';

      else {
        var im = new DOMParser().parseFromString(p['regular-body'] || '', 'text/html').querySelector('img');
