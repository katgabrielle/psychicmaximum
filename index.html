  .pm-banner {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5; height: 40px;
    display: flex; align-items: center; overflow: hidden;
    background: #EAE4D6; color: #23201C; text-decoration: none;
    border-bottom: 1px solid #23201C;
    box-shadow: 0 2px 14px rgba(0,0,0,0.4);
    font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap;
  }
  .pm-track { display: inline-flex; flex: none; animation: pm-scroll 80s linear infinite; will-change: transform; }
  .pm-banner:hover .pm-track, .pm-banner:focus-visible .pm-track { animation-play-state: paused; }
  .pm-track span { padding-right: 2.2em; }
  .pm-track i { font-style: normal; }
  @keyframes pm-scroll { to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .pm-track { animation: none; } }
  .staticrypt-content { min-height: 100%; display: flex; flex-direction: column; }
  .pm-centre { flex: 1; display: flex; align-items: center; justify-content: center; padding: 76px 16px 40px; }
  .pm-card {
    width: 100%;
    max-width: 400px;
    background: #EAE4D6;
    padding: 34px 32px 30px;
    text-align: center;
    box-shadow: 0 1px 2px rgba(0,0,0,0.35), 3px 6px 14px rgba(0,0,0,0.45), 8px 18px 40px rgba(0,0,0,0.3);
  }
  .pm-message {
    margin: 0 auto 18px;
    font-family: "Roboto", Helvetica, Arial, sans-serif;
    font-size: 13px;
    line-height: 1.5;
    color: #555;
  }
  .pm-message a { color: #111; }
  .staticrypt-password-container { position: relative; margin-bottom: 14px; }
  #staticrypt-password {
    width: 100%;
    padding: 12px 44px 12px 14px;
    border: 1px solid #A49C8E;
    border-radius: 0;
    background: #F4EFE3;
    color: #23201C;
    font-family: "Roboto", Helvetica, Arial, sans-serif;
    font-size: 16px;
    outline: none;
  }
  #staticrypt-password::placeholder { color: #8C8780; }
  #staticrypt-password:focus { border-color: #23201C; }
  .staticrypt-toggle-password-visibility {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    width: 20px; height: 20px; opacity: 0.5; cursor: pointer;
  }
  .staticrypt-decrypt-button {
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 0;
    background: #23201C;
    color: #EAE4D6;
    font-family: "Roboto", Helvetica, Arial, sans-serif;
    font-size: 13px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    cursor: pointer;
    -webkit-appearance: none;
  }
  .staticrypt-decrypt-button:hover { background: #000; }
  label.staticrypt-remember {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-bottom: 14px; font-size: 12px; color: #4a453e; cursor: pointer;
  }
  .hidden { display: none !important; }
  .staticrypt-spinner-container { height: 100%; display: flex; align-items: center; justify-content: center; }
  .staticrypt-spinner {
    width: 2rem; height: 2rem; border: 0.2em solid #EAE4D6; border-right-color: transparent;
    border-radius: 50%; animation: spin 0.75s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 600px) {
    .pm-card { padding: 30px 22px 26px; }
    .pm-banner { font-size: 11px; height: 36px; }
    .pm-centre { padding-top: 68px; }
  }
