  .pm-banner {

    font-size: 13px;

  }
  .staticrypt-decrypt-button {
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 0;
    background: #23201C;
    color: #EAE4D6;
    font-family: "Roboto", Helvetica, Arial, sans-serif;
